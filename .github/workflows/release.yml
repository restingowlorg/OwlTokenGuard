name: Release

on:
  workflow_dispatch:
    inputs:
      release_mode:
        description: "Choose prerelease for staging/next or stable for main/latest"
        required: true
        default: prerelease
        type: choice
        options:
          - prerelease
          - stable
  push:
    branches:
      - main

concurrency:
  group: release-${{ github.ref }}-${{ github.event_name }}-${{ inputs.release_mode || 'stable' }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Detect release-ready package
        id: package_state
        shell: bash
        run: |
          if node -e 'const pkg=require("./package.json"); process.exit(pkg.name === "@restingowlorg/owltokenguard" && Boolean(pkg.scripts?.release) && Boolean(pkg.scripts?.["release:validate"]) ? 0 : 1)'; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "OwlTokenGuard release metadata is not present yet; skipping bootstrap release job."
          fi

      - name: Setup Node.js
        if: steps.package_state.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.x
          cache: npm

      - name: Determine release mode
        if: steps.package_state.outputs.ready == 'true'
        id: mode
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.release_mode }}" = "prerelease" ]; then
            echo "mode=prerelease" >> "$GITHUB_OUTPUT"
          else
            echo "mode=stable" >> "$GITHUB_OUTPUT"
          fi

      - name: Show release context
        if: steps.package_state.outputs.ready == 'true'
        run: |
          echo "Event: ${{ github.event_name }}"
          echo "Branch: ${GITHUB_REF_NAME}"
          echo "Mode: ${{ steps.mode.outputs.mode }}"

      - name: Enforce release branch policy
        if: steps.package_state.outputs.ready == 'true'
        run: |
          if [ "${{ steps.mode.outputs.mode }}" = "stable" ] && [ "${GITHUB_REF_NAME}" != "main" ]; then
            echo "Stable releases are only allowed from main." >&2
            exit 1
          fi

          if [ "${{ steps.mode.outputs.mode }}" = "prerelease" ] && [ "${GITHUB_REF_NAME}" != "staging" ]; then
            echo "Prereleases are only allowed from staging." >&2
            exit 1
          fi

      - name: Force OIDC trusted publishing
        if: steps.package_state.outputs.ready == 'true'
        run: |
          echo "NODE_AUTH_TOKEN=" >> "$GITHUB_ENV"
          echo "NPM_TOKEN=" >> "$GITHUB_ENV"

      - name: Verify trusted publishing runtime
        if: steps.package_state.outputs.ready == 'true'
        run: |
          echo "Node: $(node --version)"
          echo "npm: $(npm --version)"
          node -e 'const [major, minor] = process.versions.node.split(".").map(Number); if (major < 22 || (major === 22 && minor < 14)) { console.error("npm trusted publishing requires Node 22.14.0 or later."); process.exit(1); }'

      - name: Install dependencies
        if: steps.package_state.outputs.ready == 'true'
        run: npm ci

      - name: Enter prerelease mode and version packages
        if: steps.package_state.outputs.ready == 'true' && steps.mode.outputs.mode == 'prerelease'
        run: |
          if [ ! -f ".changeset/pre.json" ]; then
            npx changeset pre enter next
          fi
          npm run version-packages

      - name: Validate release quality gates
        if: steps.package_state.outputs.ready == 'true'
        run: npm run release:validate

      - name: Create npm package artifact
        if: steps.package_state.outputs.ready == 'true'
        run: npm pack --json > pack-output.json

      - name: Smoke test npm package artifact on Node 18
        if: steps.package_state.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Smoke test npm package artifact on Node 18
        if: steps.package_state.outputs.ready == 'true'
        run: |
          PACK_FILE=$(node -e 'const fs=require("fs");const out=JSON.parse(fs.readFileSync("pack-output.json","utf8"));process.stdout.write(out[0].filename)')
          TMP_DIR=$(mktemp -d)
          cd "$TMP_DIR"
          npm init -y >/dev/null 2>&1
          npm install "$GITHUB_WORKSPACE/$PACK_FILE"
          node -e 'require("@restingowlorg/owltokenguard"); console.log("artifact smoke test passed on Node 18")'

      - name: Smoke test npm package artifact on Node 20
        if: steps.package_state.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Smoke test npm package artifact on Node 20
        if: steps.package_state.outputs.ready == 'true'
        run: |
          PACK_FILE=$(node -e 'const fs=require("fs");const out=JSON.parse(fs.readFileSync("pack-output.json","utf8"));process.stdout.write(out[0].filename)')
          TMP_DIR=$(mktemp -d)
          cd "$TMP_DIR"
          npm init -y >/dev/null 2>&1
          npm install "$GITHUB_WORKSPACE/$PACK_FILE"
          node -e 'require("@restingowlorg/owltokenguard"); console.log("artifact smoke test passed on Node 20")'

      - name: Restore trusted publishing Node runtime
        if: steps.package_state.outputs.ready == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: 22.x

      - name: Smoke test npm package artifact on Node 22
        if: steps.package_state.outputs.ready == 'true'
        run: |
          PACK_FILE=$(node -e 'const fs=require("fs");const out=JSON.parse(fs.readFileSync("pack-output.json","utf8"));process.stdout.write(out[0].filename)')
          TMP_DIR=$(mktemp -d)
          cd "$TMP_DIR"
          npm init -y >/dev/null 2>&1
          npm install "$GITHUB_WORKSPACE/$PACK_FILE"
          node -e 'require("@restingowlorg/owltokenguard"); console.log("artifact smoke test passed on Node 22")'

      - name: Verify OIDC trusted publishing is in use
        if: steps.package_state.outputs.ready == 'true'
        run: |
          if [ -n "${NODE_AUTH_TOKEN}" ]; then
            echo "Unexpected NODE_AUTH_TOKEN detected. Remove NPM_TOKEN/NODE_AUTH_TOKEN secrets to use npm trusted publishing." >&2
            exit 1
          fi

      - name: Publish prerelease to next tag
        if: steps.package_state.outputs.ready == 'true' && steps.mode.outputs.mode == 'prerelease'
        uses: changesets/action@v1
        with:
          publish: npm run release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""

      - name: Exit prerelease mode for stable release
        if: steps.package_state.outputs.ready == 'true' && steps.mode.outputs.mode == 'stable'
        run: |
          if [ -f ".changeset/pre.json" ]; then
            npx changeset pre exit
          fi

      - name: Create release pull request or publish
        if: steps.package_state.outputs.ready == 'true' && steps.mode.outputs.mode == 'stable'
        uses: changesets/action@v1
        with:
          version: npm run version-packages
          publish: npm run release
          title: "chore(release): version packages"
          commit: "chore(release): version packages"
          createGithubReleases: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          NODE_AUTH_TOKEN: ""
          NPM_TOKEN: ""
